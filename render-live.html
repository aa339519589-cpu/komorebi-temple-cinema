<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><title>KOMOREBI · live source render</title>
<link rel="icon" href="data:,">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10140f;color:#ded3bc}
canvas{display:block;max-width:100%;max-height:100%;object-fit:contain}
#loading{position:absolute;inset:0;display:grid;place-content:center;background:#10140f;text-align:center;font:15px system-ui;z-index:3}
body.render canvas{margin:auto}#ui{display:none}
</style>
<script type="importmap">{"imports":{"three":"/src/three-render-compat.js","three/addons/":"/vendor/examples/jsm/"}}</script>
<script>
addEventListener('error',e=>parent!==window&&parent.postMessage({kind:'komorebi-runtime-error',message:String(e.message||e.error)},location.origin));
addEventListener('unhandledrejection',e=>parent!==window&&parent.postMessage({kind:'komorebi-runtime-error',message:String(e.reason)},location.origin));
addEventListener('pagehide',()=>{try{const t=window.temple;if(!t)return;t.disposeRoomEnvironment();t.composer.dispose();t.renderer.dispose();t.renderer.forceContextLoss();}catch{}});
</script>
</head>
<body><div id="loading">正在从源码构建真实 3D 场景…</div><div id="ui"></div>
<script type="module">
await import('./src/main.js');
import {captureReferenceFrame,capturedPixelsToPng} from './src/live-frame-capture.js';
const params = new URLSearchParams(location.search);
if(params.has('r14')){
 const temple=window.temple;
 if(!temple?.ready)throw Error('Current temple geometry is unavailable.');
 temple.ready=false;
 const [{applySanctuaryCarvedDetail},{applySanctuaryPiercedFiligree}]=await Promise.all([
  import('/src/sanctuary-carved-detail.js'),
  import('/src/sanctuary-pierced-filigree-r14.js')
 ]);
 const carving=applySanctuaryCarvedDetail({scene:temple.scene});
 const filigree=applySanctuaryPiercedFiligree({scene:temple.scene},{enabled:params.get('r14')==='1'});
 temple.r14Stage={carving,filigree};
 const originalInfo=temple.info;
 temple.info=()=>({...originalInfo(),reference6PiercedStudy:filigree.report(),castRestoration:carving.report});
 temple.ready=true;
}

window.captureValidatedReference=options=>{
 const result=captureReferenceFrame(window.temple,options),png=capturedPixelsToPng(result);
 delete result.rgbaBase64;
 return {...result,png};
};
</script>
</body></html>
