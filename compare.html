<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>参考图逐张对照 · 重制中</title><link rel="icon" href="data:,"><style>
*{box-sizing:border-box}body{margin:0;background:#11130f;color:#e9e1d0;font:14px/1.7 system-ui}main{max-width:1800px;padding:28px;margin:auto}header{display:flex;align-items:baseline;gap:20px;flex-wrap:wrap}h1{font:26px 'Songti SC',serif;margin:0}p{color:#b9b5a9;margin:8px 0}a{color:#d5c18f}nav{display:grid;grid-template-columns:repeat(10,1fr);gap:8px;margin:22px 0}button{border:1px solid #44483b;background:#20241c;color:inherit;cursor:pointer;font:inherit;padding:6px}button[aria-pressed=true]{border-color:#e4c78c;background:#49422f}nav img{display:block;width:100%;aspect-ratio:1;object-fit:cover}nav span{display:block;margin-top:3px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}figure{margin:0;min-width:0}figcaption{padding:8px 12px;background:#22271d;border-top:2px solid #5b6650}.frame{aspect-ratio:1;background:#050604;display:grid;place-items:center;border:1px solid #333a2c}.frame img{width:100%;height:100%;object-fit:contain;min-height:0;min-width:0}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:16px 0}.controls button{padding:6px 16px}.detail{border-top:1px solid #424638;padding:16px 0;max-width:1000px}.detail p{margin:5px 0}.badge{font-size:12px;letter-spacing:.12em;color:#e1b47c}.tiny{font-size:12px;color:#8f9685}
@media(max-width:650px){main{padding:14px}nav{grid-template-columns:repeat(5,1fr)}h1{font-size:22px}.pair{gap:6px}figcaption{padding:7px;font-size:12px}}
</style></head><body><main><header><h1>左侧参考，右侧当前渲染</h1><span class="badge">正在重做 · 尚未达到参考</span></header><p>逐张核对建筑轮廓、雕刻、庭院和光影。参考图只用于此对照页面，三维场景仍完全由代码生成。</p><nav id="shots" aria-label="选择参考图"></nav><div class="pair"><figure><figcaption id="ref-title">参考图 04 · 高清原图</figcaption><div class="frame"><img id="reference" alt="用户提供的参考图片"></div></figure><figure><figcaption id="render-title">当前渲染 · 第 04 镜结束</figcaption><div class="frame"><img id="current" alt="代码场景的当前测试渲染"></div></figure></div><div class="controls" aria-label="镜头阶段"><span>右侧镜头阶段：</span><button data-phase="start">近景</button><button data-phase="mid">中段</button><button data-phase="end" aria-pressed="true">拉远后</button><button id="refresh">刷新最新渲染</button></div><div class="detail"><strong id="focus"></strong><p id="gaps"></p><p class="tiny">第 02–10 项使用本次上传的 1254 × 1254 高清原图；第 01 项保留旧拼图作为辅助。两侧保留完整画幅，右侧仍是未完成的测试渲染。</p><p><a href="/review.html">查看低机位运动测试</a> · <a href="/">打开实时三维场景</a></p></div></main><script>
const notes=[
['门廊框景、红桥、正殿与五重塔的前后层次','继续校准门廊近景、桥的比例和植被遮挡，补齐寺院纵深。'],
['金色逆光下的多层屋檐与密集柱廊','屋顶轮廓、木雕密度、日照方向和台基关系仍需要逐项调整。'],
['贴近水面的莲花与桥，向上展开的殿堂','荷叶形态、水色、驳岸和建筑细部都需要继续细化。'],
['正殿中轴、宽阔石阶与层叠出檐','当前立面仍偏简化，山花雕刻、檐下构件与庭院细节没有达到参考。'],
['仰视塔体：瓦垄、斗栱和逐层收分','继续核对塔身收分、翘角、木构接缝与各层装饰。'],
['低处礼佛：连续的造像、繁密佛龛与暖光','正在重做佛像连续曲面和衣褶；佛龛层次、金属质感和光影仍有差距。'],
['寺院群的空间层次与庭院丰富度','电影机位保持低位，仍需补足远近建筑关系和地面细节。'],
['柱廊框景与重叠的殿阁、五重塔','继续调整近景遮挡与视线通道，补齐雕刻和园林层次。'],
['水面倒影和寺院灯火','最终保持用户要求的黄金时段；当前水面与光线仍在打磨。'],
['雨后石板、檐下框景与庭院倒影','最终保持黄金时段；继续细化湿润石材、积水边缘和近景构件。']];
const referenceFiles=['/references/01.png','/references/hd/1-照片-2.jpg','/references/hd/2-照片-3.jpg','/references/hd/3-照片-4.jpg','/references/hd/5-照片-6.jpg','/references/hd/4-照片-5.jpg','/references/hd/6-照片-7.jpg','/references/hd/7-照片-8.jpg','/references/hd/8-照片-9.jpg','/references/hd/9-照片-10.jpg'];
const studies={4:'/qa/v5/hall-reference-study.png'};
let selected=4,phase='end';const pad=n=>String(n).padStart(2,'0');
const nav=document.getElementById('shots');
for(let n=1;n<=10;n++){const b=document.createElement('button');b.setAttribute('aria-label','参考图 '+pad(n));b.dataset.shot=n;b.innerHTML='<img src="'+referenceFiles[n-1]+'" alt=""><span>'+pad(n)+'</span>';b.onclick=()=>{selected=n;update()};nav.append(b)}
function update(){const n=pad(selected);document.getElementById('reference').src=referenceFiles[selected-1];document.getElementById('current').src=((phase==='end'&&studies[selected])||('/qa/shot-'+n+'-'+phase+'.png'))+'?v='+Date.now();document.getElementById('ref-title').textContent='参考图 '+n+(selected===1?' · 历史辅助图':' · 高清原图 1254 × 1254');document.getElementById('render-title').textContent=((phase==='end'&&studies[selected])?'当前构图研究 · 第 ':'历史运镜测试 · 第 ')+n+' 镜 · '+({start:'近景',mid:'中段',end:'拉远后'}[phase]);document.getElementById('focus').textContent=notes[selected-1][0];document.getElementById('gaps').textContent=notes[selected-1][1];nav.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.shot===selected));document.querySelectorAll('[data-phase]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.phase===phase))}
document.querySelectorAll('[data-phase]').forEach(b=>b.onclick=()=>{phase=b.dataset.phase;update()});document.getElementById('refresh').onclick=update;update();
</script></body></html>
