<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>寺院十景 · 制作预览</title><link rel="icon" href="data:,">
<style>
:root{color-scheme:dark;font:15px/1.6 system-ui,sans-serif;color:#eee5d4;background:#11130f}*{box-sizing:border-box}body{margin:0}main{max-width:1180px;margin:auto;padding:26px 24px 46px}header{display:flex;align-items:baseline;justify-content:space-between;gap:20px}h1{font:32px/1.25 'Songti SC',serif;margin:0}p{margin:10px 0;color:#c4bdac}a{color:#d6bd86;text-underline-offset:3px}nav{display:flex;gap:16px;flex-wrap:wrap;font-size:13px}.status{color:#c7b995;min-height:28px;margin:18px 0 8px}video{display:block;width:100%;max-height:73vh;aspect-ratio:1;background:#080a07;border:1px solid #333b2c;object-fit:contain}.edits{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:14px 0}button{font:inherit;color:#e9dfcc;background:#262c21;border:1px solid #4c5540;border-radius:5px;padding:8px 13px;cursor:pointer}button:disabled{opacity:.45;cursor:default}button[aria-pressed=true]{color:#fff1c9;border-color:#bca36b;background:#3b3c29}#caption{margin-left:auto;color:#bdb59e;font-size:13px}#shots{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:24px 0}#shots button{padding:0;text-align:left;overflow:hidden}#shots img{display:block;width:100%;aspect-ratio:1;object-fit:contain;background:#080a07}#shots span{display:block;padding:7px 9px;font-size:13px}.credit{font-size:12px;color:#a9a38f}dialog{background:#151911;color:#ece3d2;border:1px solid #626a50;border-radius:6px;padding:18px;width:min(1400px,96vw);max-height:94vh}dialog::backdrop{background:#000b}.dialog-head{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:10px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pair figure{margin:0}.pair figcaption{font-size:13px;margin:0 0 5px;color:#d5c49f}.pair img{display:block;width:100%;max-height:77vh;object-fit:contain;background:#070906}@media(max-width:680px){main{padding:18px 12px}header{display:block}nav{margin-top:13px}h1{font-size:28px}#shots{grid-template-columns:repeat(2,1fr)}#caption{margin:4px 0;width:100%}.pair{grid-template-columns:1fr}.pair img{max-height:65vh}}
</style>
</head>
<body><main>
<header><h1>寺院十景</h1><nav><a href="compare-ten.html?reference=1">实时 3D 对照</a><a href="https://github.com/aa339519589-cpu/komorebi-temple-cinema/tree/work/ten-view-reconstruction-20261018">公开源码</a></nav></header>
<p>十景真实 3D 制作预览 · 供桌与房间结构正在继续重建</p>
<div class="status" id="status" role="status">正在读取本轮视频进度…</div>
<video id="film" playsinline preload="metadata" poster="qa/ten-reference/film-review-sol61-rebuild-20261024-f-resume1/scene-01-end.png"></video>
<div class="edits"><button data-duration="60" aria-pressed="true" disabled>60 秒叠化剪辑</button><button data-duration="70" aria-pressed="false" disabled>70 秒完整镜头</button><button id="compare">视频画面对照</button><button id="latest-compare" disabled>建模对照</button><span id="caption">模型与画面仍在修正</span></div>
<div id="shots" aria-label="十个独立场景"></div>
<p class="credit">配乐：PeriTune / Sei Mutsuki — <a href="https://peritune.com/blog/2019/04/08/oboro/">Oboro</a> · <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>。本片使用经剪辑、淡入淡出的片段。</p>
<p class="credit">雕塑及其衍生画面：Scan-the-World / Sainsbury Centre Seated Amida · <a href="https://doi.org/10.5281/zenodo.21353739">原始来源</a> · <a href="reconstructions/scene-06/ATTRIBUTION-AND-ASSET-LICENSES.md">修改与素材许可</a> · CC BY-NC-SA 4.0，个人非商用欣赏。</p>
<dialog id="comparison"><div class="dialog-head"><strong id="pair-title">原图与当前画面</strong><select id="pair-scene" aria-label="选择对照场景"></select><button id="close">关闭</button></div><div class="pair"><figure><figcaption>参考图</figcaption><img id="reference" alt="参考图"></figure><figure><figcaption id="native-caption">视频所用原生 3D 静帧</figcaption><img id="native" alt="当前原生 3D 渲染"></figure></div></dialog>
</main>
<script type="module">
const iteration='sol61-rebuild-20261024-f-resume1',prefix=`output/${iteration}/`,$=id=>document.getElementById(id),film=$('film');
let duration=60,report=null,ready=false,selected=0,frames=[],scenes=[],latestFrames=[],latestPair=false,nextProgress=null;
function showReadyStatus(){
 $('status').textContent=`十景冻结工作版 · ${report.size[0]} × ${report.size[1]} · ${report.fps} fps；供桌和房间结构正在继续重建。`;
}
async function pollNextProgress(){try{const response=await fetch('lookdev/film-sol61-232/progress.json',{cache:'no-store'});if(response.ok){nextProgress=await response.json();if(ready)showReadyStatus();}}catch{}if((nextProgress?.completedShots||0)<10&&nextProgress?.status!=='returned-for-model-rebuild')setTimeout(pollNextProgress,15000);}
function starts(){if(duration===70)return Array.from({length:10},(_,i)=>i*7);const overlaps=report?.edits?.find(e=>e.duration===60)?.overlapFrames||Array(9).fill(24*10/9),fps=report?.fps||24,result=[0];for(let i=0;i<9;i++)result.push(result.at(-1)+7-overlaps[i]/fps);return result;}
function showPair(i=selected,latest=false){const f=latest?latestFrames[i]:frames[i],s=scenes[i];if(!f)return;latestPair=latest;$('pair-scene').value=String(i);$('pair-title').textContent=`${String(i+1).padStart(2,'0')} · ${s?.shortName||f.name}`;$('reference').src=latest?s.referenceFile:f.referenceFile;$('native').src=latest?f.native:f.nativeFile;$('native-caption').textContent=latest?'保留模型实渲 · 持续重建中'+(f.license==='CC-BY-NC-SA-4.0'?' · 仅非商用（CC BY-NC-SA 4.0）':''):'视频所用原生 3D 静帧';if(!$('comparison').open)$('comparison').showModal();}
function selectCut(value){duration=value;const playing=!film.paused;if(ready){film.src=prefix+`temple-ten-scenes-${duration}s.mp4`;if(playing)film.play().catch(()=>{});}for(const b of document.querySelectorAll('[data-duration]'))b.setAttribute('aria-pressed',String(Number(b.dataset.duration)===duration));}
for(const b of document.querySelectorAll('[data-duration]'))b.onclick=()=>selectCut(Number(b.dataset.duration));$('compare').onclick=()=>showPair();$('latest-compare').onclick=()=>showPair(selected,true);$('pair-scene').onchange=e=>showPair(Number(e.target.value),latestPair);$('close').onclick=()=>$('comparison').close();
film.addEventListener('timeupdate',()=>{const s=starts();selected=s.findLastIndex(t=>film.currentTime>=t+.55);selected=Math.max(0,selected);$('caption').textContent=`${String(selected+1).padStart(2,'0')} · ${scenes[selected]?.shortName||''}`;for(const [i,b]of [...$('shots').children].entries())b.setAttribute('aria-pressed',String(i===selected));});
try{const [manifest,config]=await Promise.all([fetch('qa/ten-reference/film-review-sol61-rebuild-20261024-f-resume1/frames.json').then(r=>r.json()),fetch('reconstructions/ten-scenes.json').then(r=>r.json())]);frames=manifest.frames;scenes=config.scenes;for(const [i,s]of scenes.entries()){$('pair-scene').add(new Option(`${String(i+1).padStart(2,'0')} · ${s.shortName}`,String(i)));}fetch('qa/ten-reference/working-model-review-20261024-l/frames.json').then(r=>r.json()).then(d=>{if(d.frames?.length===10){latestFrames=d.frames;$('latest-compare').disabled=false;}}).catch(()=>{});for(const [i,f]of frames.entries()){const b=document.createElement('button'),im=document.createElement('img'),label=document.createElement('span');im.src=f.nativeFile;im.alt=scenes[i]?.name||f.name;im.loading='lazy';label.textContent=`${String(i+1).padStart(2,'0')} · ${scenes[i]?.shortName||f.name}`;b.append(im,label);b.setAttribute('aria-pressed','false');b.onclick=()=>{selected=i;if(ready){const overlap=duration===60&&i>0?(report.edits.find(e=>e.duration===60).overlapFrames[i-1]/report.fps):0;film.currentTime=starts()[i]+overlap+.15;}else showPair(i);};b.ondblclick=()=>showPair(i);$('shots').append(b);}}catch{$('compare').disabled=true;}
async function poll(){try{const response=await fetch(prefix+'film-build.json',{cache:'no-store'});if(!response.ok)throw Error('Video not ready');report=await response.json();if(report.status==='ten-scene-draft-rendered'){if(!ready){ready=true;film.controls=true;for(const b of document.querySelectorAll('[data-duration]'))b.disabled=false;selectCut(duration);}showReadyStatus();}else if(report.status==='failed'){$('status').textContent='本轮视频尚未完成；下方可查看十景当前画面。';}else{$('status').textContent=`正在输出本轮运镜：${report.shots?.length||0} / 10 景。下方可查看当前画面。`;setTimeout(poll,5000);}}catch{$('status').textContent='正在准备本轮视频；下方可查看十景当前画面。';setTimeout(poll,5000);}}
poll();pollNextProgress();
</script></body></html>
