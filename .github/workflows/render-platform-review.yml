name: Full-scene render platform comparison
on:
  push:
    branches: [work/live-reference-render-20261017]
    paths:
      - '.github/workflows/render-platform-review.yml'
      - 'tools/platform-review-request.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: komorebi-platform-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render:
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        backend: [metal, gl]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.2.0'
      - name: Prepare pinned source and browser
        run: |
          node verify.mjs
          node --check tools/playwright-render-platform.mjs
          npm install --prefix "$RUNNER_TEMP/komorebi-runtime" --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/komorebi-runtime/node_modules/.bin/playwright" install chromium
          command -v ffmpeg || brew install ffmpeg
      - name: Render identical source under explicit backend
        timeout-minutes: 12
        env:
          REAL_PLAYWRIGHT_MODULE: ${{ runner.temp }}/komorebi-runtime/node_modules/playwright/index.mjs
          WEBGL_PLATFORM_BACKEND: ${{ matrix.backend }}
          REQUEST_FILE: tools/platform-review-request.json
          OUTPUT_DIR: output/platform-review
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          set -o pipefail
          export PLAYWRIGHT_MODULE="$GITHUB_WORKSPACE/tools/playwright-render-platform.mjs"
          mkdir -p output/platform-review
          sw_vers > output/platform-review/platform.txt
          node tools/render-output-target.mjs 2>&1 | tee output/platform-review/execution.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-${{ matrix.backend }}-${{ github.sha }}
          path: output/platform-review/
          retention-days: 7
          if-no-files-found: warn
