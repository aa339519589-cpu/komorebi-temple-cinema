name: Reference6 R14 native ornament photo-alignment
on:
  push:
    branches: [work/komorebi-v67-independent-review-20261018]
    paths: ['.github/workflows/reference6-r14-physical-ornament.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-metal-frame:
    runs-on: macos-14
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.2.0'
      - name: Verify unmodified source, true geometries and rollback
        run: |
          node verify.mjs
          node --check tools/review-new-r14-sanctuary.mjs
          node --check reconstructions/reference6-v13/src/reference6-r14-main.js
          node tools/test-reference6-r14-depth.mjs | tee reference6-r14-geometry-audit.json
      - name: Install isolated real GPU browser
        run: |
          npm install --prefix "$RUNNER_TEMP/komorebi-runtime" --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/komorebi-runtime/node_modules/.bin/playwright" install chromium
          command -v ffmpeg || brew install ffmpeg
      - name: Render R14 with current v13 shaders and actual cast shadows
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/komorebi-runtime/node_modules/playwright/index.mjs
          KOMOREBI_REFERENCE: '6'
          KOMOREBI_SIZE: '640'
        timeout-minutes: 14
        run: |
          node tools/review-new-r14-sanctuary.mjs
      - name: Preserve reference6 R14 native PNG, source and statistics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference6-r14-depth-${{ github.sha }}
          path: |
            output/independent-reference6-v13-r14/
            reference6-r14-geometry-audit.json
          retention-days: 7
          if-no-files-found: error
