name: Reference4 isolated B diagnostic Metal render
on:
  push:
    branches: [work/live-reference-render-20261017]
    paths:
      - '.github/workflows/reference4-b-dedicated.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: komorebi-reference4-b-dedicated
  cancel-in-progress: false
jobs:
  b-diagnostic:
    runs-on: macos-14
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.2.0'
      - name: Prepare exact v60 scene with lower temporary QA GPU memory
        env:
          SITE_PREVIEW_SHADOW_SIZE: '2048'
        run: |
          node verify.mjs
          node tools/prepare-site-mode.mjs
          node --check tools/render-reference4-isolated.mjs
      - name: Install self-contained native Chromium Metal
        run: |
          npm install --prefix "$RUNNER_TEMP/komorebi-runtime" --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/komorebi-runtime/node_modules/.bin/playwright" install chromium
          command -v ffmpeg || brew install ffmpeg
      - name: Retry previously failing B alone with no competing scene jobs
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/komorebi-runtime/node_modules/playwright/index.mjs
          CAMERA_ID: b
          NODE_OPTIONS: --max-old-space-size=4096
        timeout-minutes: 10
        run: |
          set -o pipefail
          mkdir -p output/reference4-isolated-b
          node tools/render-reference4-isolated.mjs 2>&1 | tee output/reference4-isolated-b/execution.log
      - name: Preserve unaltered pixels or exact failure diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference4-b-dedicated-${{ github.sha }}
          path: output/reference4-isolated-b/
          retention-days: 7
          if-no-files-found: error
