name: Hosted Metal reference review
on:
  push:
    branches: [work/live-reference-render-20261017]
    paths:
      - '.github/workflows/hosted-metal-review.yml'
      - 'tools/render-hosted-request.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: komorebi-hosted-metal-${{ github.ref }}
  cancel-in-progress: true
jobs:
  metal-review:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.2.0'
      - name: Verify source and install isolated renderer
        run: |
          node verify.mjs
          node --check tools/render-raw-review.mjs
          node --check tools/raw-webgl-readback.mjs
          node --check tools/probe-hosted-webgl.mjs
          npm install --prefix "$RUNNER_TEMP/komorebi-runtime" --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/komorebi-runtime/node_modules/.bin/playwright" install chromium
      - name: Test real WebGL backend
        id: probe
        timeout-minutes: 6
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/komorebi-runtime/node_modules/playwright/index.mjs
        run: node tools/probe-hosted-webgl.mjs
      - name: Preserve backend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-metal-probe-${{ github.sha }}
          path: output/hosted-mac/
          retention-days: 7
          if-no-files-found: warn
      - name: Prepare video utility
        if: steps.probe.outputs.usable == 'true'
        run: command -v ffmpeg || brew install ffmpeg
      - name: Archive exact tested source
        run: |
          mkdir -p review-runtime
          git rev-parse HEAD > review-runtime/COMMIT.txt
          tar -czf review-runtime/current-source.tar.gz src vendor tools references music render-live.html compare-live.html index.html viewer.mjs serve.mjs verify.mjs package.json checksums.json frozen-manifest.json README.md LICENSE
          shasum -a 256 review-runtime/current-source.tar.gz > review-runtime/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: current-metal-runtime-${{ github.sha }}
          path: review-runtime/
          retention-days: 7
          if-no-files-found: error
      - name: Render and directly read actual WebGL pixels
        if: steps.probe.outputs.usable == 'true'
        timeout-minutes: 12
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/komorebi-runtime/node_modules/playwright/index.mjs
          REQUEST_FILE: tools/render-hosted-request.json
          OUTPUT_DIR: output/hosted-metal-review
          MAX_JOBS: '1'
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          set -o pipefail
          mkdir -p output/hosted-metal-review
          node tools/render-raw-review.mjs 2>&1 | tee output/hosted-metal-review/execution.log
      - name: Preserve actual pixels and execution receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-metal-review-${{ github.sha }}
          path: output/hosted-metal-review/
          retention-days: 7
          if-no-files-found: warn
