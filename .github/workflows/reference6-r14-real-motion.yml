name: Reference6 R14 real 180-frame temple film
on:
  push:
    branches: [work/komorebi-v67-independent-review-20261018]
    paths: ['.github/workflows/reference6-r14-real-motion.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reference6-r14-film-${{ github.ref }}
  cancel-in-progress: false
jobs:
  film:
    runs-on: macos-14
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.2.0'
      - name: Confirm real original model and source continuity
        run: |
          set -euo pipefail
          node verify.mjs
          node --check tools/render-reference6-r14-motion.mjs
          node tools/test-reference6-r14-depth.mjs
          test -f reconstructions/reference6-v13/r14.html
          test -f music/PerituneMaterial_Oboro.mp3
      - name: Prepare isolated Metal browser and video encoder
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/komorebi-runtime" --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/komorebi-runtime/node_modules/.bin/playwright" install chromium
          command -v ffmpeg || brew install ffmpeg
      - name: Render 180 genuine WebGL frames and join final 6-second H264 AAC review
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/komorebi-runtime/node_modules/playwright/index.mjs
          NODE_OPTIONS: --max-old-space-size=8192
        timeout-minutes: 34
        run: |
          set -euo pipefail
          node tools/render-reference6-r14-motion.mjs
      - name: Preserve frames, movie and verifiable GL/image provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genuine-r14-180-frames-${{ github.sha }}
          path: output/r14-sanctuary-real-motion/
          retention-days: 7
          if-no-files-found: warn
