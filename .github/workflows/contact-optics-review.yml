name: Sanctuary optical restoration comparison
on:
  push:
    branches: [work/live-reference-render-20261017]
    paths:
      - '.github/workflows/contact-optics-review.yml'
      - 'src/sanctuary-contact-optics.js'
      - 'tools/render-contact-study.mjs'
permissions:
  contents: read
concurrency:
  group: sanctuary-contact-optics-${{ github.ref }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: macos-14
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        study: [contact, depth, longlens, warm]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.2.0'
      - name: Verify current code and install isolated browser
        run: |
          node verify.mjs
          node --check src/sanctuary-contact-optics.js
          node --check tools/render-contact-study.mjs
          npm install --prefix "$RUNNER_TEMP/komorebi-runtime" --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/komorebi-runtime/node_modules/.bin/playwright" install chromium
          command -v ffmpeg || brew install ffmpeg
      - name: Render existing geometry and compare to supplied reference
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/komorebi-runtime/node_modules/playwright/index.mjs
          STUDY: ${{ matrix.study }}
          SIZE: '800'
        run: |
          set -o pipefail
          mkdir -p output/contact-${{ matrix.study }}
          node tools/render-contact-study.mjs 2>&1 | tee output/contact-${{ matrix.study }}/execution.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contact-${{ matrix.study }}-${{ github.sha }}
          path: output/contact-${{ matrix.study }}/
          retention-days: 7
          if-no-files-found: warn
