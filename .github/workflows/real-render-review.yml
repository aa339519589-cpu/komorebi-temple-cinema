name: Current-source real WebGL review
on:
  push:
    branches: [work/live-reference-render-20261017]
    paths: ['.github/workflows/real-render-review.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: komorebi-real-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  software-fallback-retired:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Keep completed evidence; do not waste a second software render
        run: |
          echo 'This startup supersedes the earlier software-WebGL fallback job.'
          echo 'Real hosted Metal has been measured; subsequent image reviews use hosted-metal-review.yml.'
          echo 'Prior uploaded runtime artifacts remain unchanged. This job does not render or alter scene source.'
