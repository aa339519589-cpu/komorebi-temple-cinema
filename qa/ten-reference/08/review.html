<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>参考08 · 原图与实际渲染逐处比对</title><style>*{box-sizing:border-box}body{margin:0;background:#161715;color:#e8e4da;font:14px system-ui}header{display:flex;gap:20px;align-items:center;padding:14px 20px;border-bottom:1px solid #555;position:sticky;top:0;background:#191b18;z-index:2}header strong{margin-right:auto}select,input,button{font:inherit;background:#33382e;color:inherit;border:1px solid #646f58;padding:5px}main{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:#777;height:calc(100vh - 140px)}figure{margin:0;background:#22251e;overflow:auto;position:relative}figcaption{padding:9px 16px;background:#22251eea;position:sticky;top:0;z-index:1}img{display:block;width:100%;max-width:none;transform-origin:top left}footer{padding:10px 20px;line-height:1.7;color:#c7c4b8}footer span{color:#f1c577}</style><header><strong>参考08 · 原图在左，实际三维渲染在右</strong><label>候选 <select id="version"><option value="1">第一轮</option><option value="2">第二轮</option><option value="3">第三轮</option><option value="4" selected>第四轮</option><option value="5">第五轮</option></select></label><label>同步缩放 <input id="zoom" type="range" min="100" max="250" value="100"></label><button id="blink">按住查看原图</button></header><main><figure id="left"><figcaption>高清原图 · references/hd/7-照片-8.jpg</figcaption><img src="../../../references/hd/7-照片-8.jpg" alt="参考08高清原图"></figure><figure id="right"><figcaption id="caption">第四轮 · 实际GPU输出 · 未验收</figcaption><img id="candidate" src="iteration-04/reference.png" alt="参考08实际渲染"></figure></main><footer><span id="status">当前图不代表验收通过。</span> 逐处检查：近柱金饰与吊灯、框檐底板和承托、左上瓦面与长曲檐、塔身白墙和斗栱、层叠廊屋、桥与近栏相对高度、松枫枝冠、溪流岩苔与近叶。左右两图保持相同显示宽度；滚动与缩放同步。</footer><script>
const version=document.querySelector('#version'),candidate=document.querySelector('#candidate'),left=document.querySelector('#left'),right=document.querySelector('#right'),caption=document.querySelector('#caption'),status=document.querySelector('#status');let candidateURL=candidate.src,locked=false;
version.onchange=()=>{const n=version.value,url=`iteration-${n.padStart(2,'0')}/reference.png`,probe=new Image();probe.onload=()=>{candidate.src=url;candidateURL=candidate.src;caption.textContent=`第${n}轮 · 实际GPU输出 · 未验收`;status.textContent='逐处对照，不以CPU检查或几何数量替代图像验收。';};probe.onerror=()=>{status.textContent=`第${n}轮PNG尚未写入，继续显示上一张实际输出。`;};probe.src=url;};
for(const [a,b]of[[left,right],[right,left]])a.onscroll=()=>{if(locked)return;locked=true;b.scrollTop=a.scrollTop;b.scrollLeft=a.scrollLeft;requestAnimationFrame(()=>locked=false);};
document.querySelector('#zoom').oninput=e=>document.querySelectorAll('img').forEach(i=>i.style.width=e.target.value+'%');const blink=document.querySelector('#blink');blink.onpointerdown=()=>candidate.src=left.querySelector('img').src;for(const event of['pointerup','pointerleave','pointercancel'])blink.addEventListener(event,()=>candidate.src=candidateURL);
</script></html>
