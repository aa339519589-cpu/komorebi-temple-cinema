<!doctype html><html><head><meta charset="utf-8"><link rel="icon" href="data:,"><script type="importmap">{"imports":{"three":"/vendor/build/three.module.js","three/addons/":"/vendor/examples/jsm/"}}</script></head><body><script type="module">
import * as T from 'three';
import {RectAreaLightUniformsLib} from 'three/addons/lights/RectAreaLightUniformsLib.js';
import {installBrdfLookupAtlas} from '/src/brdf-lookup-atlas.js';
import {installMaterialSamplerPacking} from '/src/material-sampler-packing.js';
RectAreaLightUniformsLib.init();
function fixture(stress){
 const scene=new T.Scene(),resources=[];scene.background=new T.Color(.02,.025,.03);
 function tex(data,srgb=false){const t=new T.DataTexture(data,32,32,T.RGBAFormat,T.UnsignedByteType);t.wrapS=t.wrapT=T.RepeatWrapping;t.minFilter=T.LinearMipmapLinearFilter;t.magFilter=T.LinearFilter;t.generateMipmaps=true;t.repeat.set(2.3,1.7);if(srgb)t.colorSpace=T.SRGBColorSpace;t.needsUpdate=true;resources.push(t);return t;}
 const c=new Uint8Array(32*32*4),n=new Uint8Array(c.length),q=new Uint8Array(c.length);
 for(let y=0;y<32;y++)for(let x=0;x<32;x++){const i=(y*32+x)*4;c.set([80+x*4,95+y*3,48+x*2,255],i);n.set([128+Math.round(32*Math.sin(x*.7)),128+Math.round(30*Math.cos(y*.5)),246,255],i);q.set([y*7,35+(x*13+y*7)%210,0,255],i);}
 const map=tex(c,true),normal=tex(n),rough=tex(q);
 const leaf=new T.MeshStandardMaterial({name:'leaf-fixture',color:0x83b357,map,bumpMap:map,emissiveMap:map,emissive:0x344e20,emissiveIntensity:.3,bumpScale:.012,roughness:.68});
 const stone=new T.MeshPhysicalMaterial({name:'wet-stone-fixture',color:0xbcb6a8,map,normalMap:normal,normalScale:new T.Vector2(.28,.28),roughnessMap:rough,roughness:.48,metalness:0,clearcoat:.36,clearcoatRoughness:.13});
 const geom=new T.SphereGeometry(.8,40,32);resources.push(geom,leaf,stone);const a=new T.Mesh(geom,leaf),b=new T.Mesh(geom,stone);a.position.x=-.95;b.position.x=.95;a.castShadow=b.castShadow=a.receiveShadow=b.receiveShadow=true;scene.add(a,b);
 const envData=new Float32Array(32*16*4);for(let y=0;y<16;y++)for(let x=0;x<32;x++){const v=.3+1.2*Math.max(0,Math.cos(x/32*Math.PI*2));envData.set([v*1.1,v,v*.8,1],(y*32+x)*4);}
 const env=new T.DataTexture(envData,32,16,T.RGBAFormat,T.FloatType);env.mapping=T.EquirectangularReflectionMapping;env.needsUpdate=true;scene.environment=env;resources.push(env);
 const area=new T.RectAreaLight(0xffdfaf,4,4,2);area.position.set(0,2,3);area.lookAt(0,0,0);scene.add(area);
 const sun=new T.DirectionalLight(0xffe4c3,1.5);sun.position.set(-4,5,4);sun.castShadow=true;sun.shadow.mapSize.set(64,64);scene.add(sun);
 for(let i=0;i<(stress?7:1);i++){const s=new T.SpotLight(0xffd9ae,5,12,.8,.5,2);s.position.set(-3+i,3,4);s.castShadow=true;s.shadow.mapSize.set(64,64);scene.add(s,s.target);}
 for(let i=0;i<(stress?4:0);i++){const p=new T.PointLight(0xd8eaff,3,10,2);p.position.set(-2+i*1.3,-1,2);p.castShadow=true;p.shadow.mapSize.set(64,64);scene.add(p);}
 const camera=new T.PerspectiveCamera(38,384/256,.1,30);camera.position.set(0,0,5);camera.lookAt(0,0,0);return{scene,camera,resources};
}
window.auditPacking=()=>{
 const frames=[];for(const mode of ['native','packed','packed-stress']){
  const r=new T.WebGLRenderer({antialias:false,preserveDrawingBuffer:true});r.setSize(384,256);r.shadowMap.enabled=true;r.shadowMap.type=T.PCFShadowMap;r.toneMapping=T.ACESFilmicToneMapping;
  const atlas=mode==='native'?null:installBrdfLookupAtlas(r),packing=mode==='native'?null:installMaterialSamplerPacking();const f=fixture(mode==='packed-stress');packing?.prepare(f.scene);r.render(f.scene,f.camera);const g=r.getContext();g.finish();const pixels=new Uint8Array(384*256*4);g.readPixels(0,0,384,256,g.RGBA,g.UNSIGNED_BYTE,pixels);
  const types=[g.SAMPLER_2D,g.SAMPLER_CUBE,g.SAMPLER_2D_SHADOW,g.SAMPLER_CUBE_SHADOW];const programs=r.info.programs.map(p=>{const linked=g.getProgramParameter(p.program,g.LINK_STATUS),samplers=[];if(linked)for(let i=0;i<g.getProgramParameter(p.program,g.ACTIVE_UNIFORMS);i++){const u=g.getActiveUniform(p.program,i);if(types.includes(u.type))samplers.push({name:u.name,size:u.size});}return{linked,count:samplers.reduce((a,b)=>a+b.size,0),samplers,log:linked?'':g.getProgramInfoLog(p.program)};});
  frames.push({mode,pixels:Array.from(pixels),png:r.domElement.toDataURL('image/png'),glError:g.getError(),maxTextureUnits:g.getParameter(g.MAX_TEXTURE_IMAGE_UNITS),programs,packing:packing?.info()||null});
  f.resources.forEach(x=>x.dispose());r.dispose();r.forceContextLoss();packing?.dispose();atlas?.dispose();
 }
 const a=frames[0].pixels,b=frames[1].pixels;let sum=0,max=0,n=0,changed=0;for(let i=0;i<a.length;i++)if(i%4!==3){const d=Math.abs(a[i]-b[i]);sum+=d;max=Math.max(max,d);changed+=d>0;n++;}frames.forEach(f=>delete f.pixels);
 const comparison={meanAbsolute8bit:sum/n,maxAbsolute8bit:max,changedRgbSamples:changed,rgbSamples:n};return{frames,comparison,passed:comparison.meanAbsolute8bit<.15&&max<=4&&frames.every(f=>f.glError===0&&f.programs.every(p=>p.linked&&p.count<=f.maxTextureUnits))};
};window.ready=true;
</script></body></html>
