<!doctype html><html><head><meta charset="utf-8"><link rel="icon" href="data:,"><script type="importmap">{"imports":{"three":"/vendor/build/three.module.js","three/addons/":"/vendor/examples/jsm/"}}</script></head><body><script type="module">
import * as T from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
import {captureOutputTarget} from '/src/capture-output-target.js';
try{
 const renderer=new T.WebGLRenderer({preserveDrawingBuffer:true,antialias:false});renderer.setSize(192,128);renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;document.body.append(renderer.domElement);
 const scene=new T.Scene();scene.background=new T.Color(.03,.07,.13);const camera=new T.PerspectiveCamera(45,1.5,.1,30);camera.position.set(0,0,4);
 const mesh=new T.Mesh(new T.SphereGeometry(1,24,16),new T.MeshStandardMaterial({color:0xcf953b,roughness:.4,metalness:.3}));scene.add(mesh,new T.HemisphereLight(0xffffff,0x453526,3));const sun=new T.DirectionalLight(0xffffff,2);sun.position.set(2,3,4);scene.add(sun);
 const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));composer.addPass(new OutputPass());composer.render();
 const gl=renderer.getContext(),native=new Uint8Array(192*128*4);gl.readPixels(0,0,192,128,gl.RGBA,gl.UNSIGNED_BYTE,native);
 const capture=captureOutputTarget({renderer,composer},()=>composer.render());const binary=atob(capture.rgbaBase64);let total=0,max=0,count=0;
 for(let y=0;y<128;y++)for(let x=0;x<192;x++)for(let c=0;c<3;c++){const d=Math.abs(native[((127-y)*192+x)*4+c]-binary.charCodeAt((y*192+x)*4+c));total+=d;max=Math.max(max,d);count++;}
 const ext=gl.getExtension('WEBGL_debug_renderer_info');
 window.captureTestResult={passed:max<=1&&gl.getError()===0,meanAbsolute8bit:total/count,maxAbsolute8bit:max,gpu:ext?gl.getParameter(ext.UNMASKED_RENDERER_WEBGL):'unknown',stages:capture.stages,width:capture.width,height:capture.height,method:capture.provenance};console.info(JSON.stringify(window.captureTestResult));
}catch(e){window.captureTestResult={passed:false,error:String(e.stack||e)};console.error(e)}
</script></body></html>
