:root{color-scheme:dark;font:15px/1.6 system-ui;background:#10120f;color:#e8deca}*{box-sizing:border-box}body{margin:0}main{max-width:1240px;margin:auto;padding:24px}h1{font:30px 'Songti SC',serif;margin:0}p{color:#bdb6a7}a{color:#e4cd8c}video{width:100%;max-height:80vh;background:#000;display:block;margin-top:16px}button{background:#282d23;color:#e8deca;border:1px solid #686b52;padding:10px 16px;border-radius:4px;cursor:pointer;margin:12px 8px 0 0;font:inherit}button[aria-pressed=true]{border-color:#e4cd8c}#shots{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:26px 0}figure{margin:0}figure img{display:block;width:100%;aspect-ratio:1;object-fit:contain}figcaption{font-size:13px;margin-top:6px}.pair{display:block;margin:20px 0}.pair img{width:100%;display:block}small{color:#bdb6a7}@media(max-width:650px){main{padding:14px}#shots{grid-template-columns:repeat(2,1fr)}}
</style><main><h1>十景 · 当前制作版</h1><p>十个场景，逐景建模。当前画面仍在按原图修正。</p><div id="status">正在准备十景视频…</div><video id="film" controls playsinline preload="metadata" poster="qa/ten-reference/01/iteration-parallel40/reference.png" hidden></video><div id="edits" hidden><button data-duration="60" aria-pressed="true">60 秒叠化剪辑</button><button data-duration="70" aria-pressed="false">70 秒完整镜头 · 每景 7 秒</button></div><p><small>配乐：PeriTune / Sei Mutsuki — <a href="https://peritune.com/blog/2019/04/08/oboro/">Oboro</a> · CC BY 4.0。尺八、筝与钢琴。</small></p><p><a href="compare-ten.html?reference=1">打开原图与实时 3D 左右对照</a> · <a href="https://github.com/aa339519589-cpu/komorebi-temple-cinema/tree/work/ten-view-reconstruction-20261018">公开源代码</a></p><div id="shots"></div><h2>全部十景 · 原图与当前实渲</h2><div id="pairs"></div></main><script type="module">
const $=id=>document.getElementById(id),film=$('film');let duration='60',ready=false;
function select(value){duration=value;const playing=!film.paused;film.src=`output/hour-1832-film/temple-ten-scenes-${value}s.mp4`;document.querySelectorAll('button[data-duration]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.duration===value)));if(playing)film.play().catch(()=>{});}
for(const b of document.querySelectorAll('button[data-duration]'))b.onclick=()=>select(b.dataset.duration);
const progress=await(await fetch('qa/ten-reference/progress.json')).json();for(const item of progress.scenes){const a=document.createElement('a');a.href='#scene-'+item.reference;const f=document.createElement('figure'),im=document.createElement('img'),label=document.createElement('figcaption');im.src=item.actualFrame;im.alt=item.name;im.loading='lazy';label.textContent=String(item.reference).padStart(2,'0')+' '+item.shortName;f.append(im,label);a.append(f);$('shots').append(a);const pair=document.createElement('a');pair.className='pair';pair.id='scene-'+item.reference;pair.href=item.comparison;const picture=document.createElement('img');picture.src=item.comparison;picture.alt=item.name+'：左原图，右当前实渲';picture.loading='lazy';pair.append(picture);$('pairs').append(pair);}
async function poll(){try{const report=await(await fetch('output/hour-1832-film/film-build.json',{cache:'no-store'})).json();if(report.status==='ten-scene-draft-rendered'){if(!ready){ready=true;film.hidden=false;$('edits').hidden=false;select(duration);}$('status').textContent='十景制作版 · 1080 ×1080 · 30 fps · 画面仍待继续修正';}else if(report.status==='failed'){$('status').textContent='视频输出中遇到问题，正在处理；下方可查看全部十景实图。';}else{$('status').textContent=`正在输出十个独立场景的运镜：已完成 ${report.shots.length} /10。下方可查看当前实图。`;setTimeout(poll,6000);}}catch{setTimeout(poll,6000);}}poll();
</script></html>
