<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>低机位重制 · 构图测试</title><link rel="icon" href="data:,"><style>*{box-sizing:border-box}body{margin:0;background:#0d100d;color:#e9dec7;font:15px system-ui}main{max-width:1500px;margin:auto;padding:36px}header{border-bottom:1px solid #514a36;padding-bottom:22px;margin-bottom:24px}small{color:#c0a976;letter-spacing:.18em}h1{font:30px 'Songti SC',Georgia,serif;letter-spacing:.15em;margin:12px 0}p{color:#b3ad9c;line-height:1.9;margin:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}figure{margin:0}img,video{display:block;width:100%;background:#000;border:1px solid #3b4134}figcaption{padding:12px 0;color:#c5b998}figure.wide{grid-column:1/-1}.note{color:#c7a96e;margin-top:22px}a{color:#c7b98e}#motion{display:none;margin-bottom:24px}</style></head><body><main><header><small>重制构图与运镜测试 · 不是成品</small><h1>从观者下方向上仰观</h1><p>正殿与塔体重新建立高大体量；佛堂机位降到跪坐高度。当前先核对仰视关系、空间重量和连续运镜，材质、雕刻、光线仍会继续打磨。</p></header><section id="motion"><video id="movie" poster="/qa/shot-04-end.png" controls playsinline preload="metadata"></video><p>低机位重制运动测试 · 十镜头 · 尺八与筝配乐</p></section><section class="grid"><figure><img src="/qa/shot-04-end.png" alt="主殿低机位构图测试"><figcaption>正殿：低于人眼的机位，抬高石台与殿身体量。</figcaption></figure><figure><img src="/qa/shot-06-end.png" alt="跪坐高度仰视佛像测试"><figcaption>佛堂：相机高出地板约 65 厘米，向上仰视佛像。</figcaption></figure><figure class="wide"><img src="/qa/shot-05-end.png" alt="从塔体下方向上取景"><figcaption>塔体：从下方向上取景，以近景构件和完整层级建立尺度。</figcaption></figure></section><p><a href="/compare.html">左侧参考、右侧当前渲染：逐张对照</a></p><p class="note">第一版视频已否决，不再作为交付候选。这里展示的是重制过程中的测试帧。</p><p>新配乐候选：PeriTune《Oboro》，<a href="https://peritune.com/blog/2019/04/08/oboro/">作品及许可说明</a>。</p></main><script>async function update(){try{const r=await fetch('/output/review-status.json',{cache:'no-store'});if(r.ok){const s=await r.json();if(s.ready){const v=document.getElementById('movie');if(v.getAttribute('src')!==s.url){v.src=s.url;document.getElementById('motion').style.display='block';}}}}catch{}}update();setInterval(update,12000);</script></body></html>
